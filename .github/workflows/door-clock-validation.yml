name: Door Time Clock validation
on:
  push:
    branches: [feature/door-tap-clock-20260924]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: door-clock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/door-browser" --no-save --package-lock=false @playwright/test@1.57.0
          "$RUNNER_TEMP/door-browser/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Verify actual Next pages in Chromium, Firefox and WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/door-browser/node_modules
        run: node scripts/verify-door-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: door-clock-evidence
          path: artifacts/door-clock
          retention-days: 7
