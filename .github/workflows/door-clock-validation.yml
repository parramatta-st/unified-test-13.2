name: Door Time Clock validation
on:
  push:
    branches: [feature/door-tap-clock-20260924]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: door-clock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package isolated source and runtime for review
        run: |
          tar --exclude='./.git' --exclude='./.next' --exclude='./.env*' --exclude='./node_modules/.cache' -czf "$RUNNER_TEMP/portal-review.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: portal-review
          path: ${{ runner.temp }}/portal-review.tgz
          retention-days: 2
